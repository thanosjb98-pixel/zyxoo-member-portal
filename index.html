
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zyxoo The ContentPilot</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; padding: 30px 16px;
      background: #090b12; color: #fff;
      font-family: Arial, sans-serif;
      display: flex; align-items: center; justify-content: center;
    }
    .card {
      width: 100%; max-width: 430px; padding: 32px;
      background: #141824; border: 1px solid #292f40;
      border-radius: 18px;
    }
    h1 { text-align: center; letter-spacing: 3px; }
    .sub { text-align: center; color: #aab1c3; }
    .price { text-align: center; font-size: 27px; font-weight: bold; margin: 24px 0; }
    input, button {
      width: 100%; padding: 14px; margin: 8px 0;
      border-radius: 9px; font-size: 15px;
    }
    input { background: #0c101a; border: 1px solid #353d50; color: white; }
    button { border: 0; cursor: pointer; font-weight: bold; }
    .primary { background: #a78bfa; color: #090b12; }
    .secondary { background: #252c3d; color: white; }
    #message { color: #c4b5fd; text-align: center; line-height: 1.5; }
    .hidden { display: none; }
    .status { padding: 18px; border-radius: 10px; background: #202638; line-height: 1.6; }
  select, textarea {
  width: 100%;
  padding: 14px;
  margin: 8px 0;
  border-radius: 9px;
  font-size: 15px;
  background: #0c101a;
  border: 1px solid #353d50;
  color: white;
}

textarea {
  resize: vertical;
  line-height: 1.5;
}

label {
  display: block;
  margin-top: 14px;
  color: #aab1c3;
  font-size: 12px;
}

#generationMessage {
  color: #c4b5fd;
  margin: 10px 0;
  line-height: 1.5;
}
  </style>
</head>
<body>
  <main class="card">
    <h1>ZYXOO</h1>
    <p class="sub">THE CONTENTPILOT</p>
    <div class="price">₱499 <span style="font-size:14px">/ Lifetime Access</span></div>

    <section id="authSection">
      <h2>Member Login</h2>
      <p class="sub">Create an account or log in to continue.</p>

      <input id="email" type="email" placeholder="Your email address">
      <input id="password" type="password" placeholder="Password (minimum 6 characters)">

      <button class="primary" onclick="signUp()">CREATE ACCOUNT</button>
      <button class="secondary" onclick="signIn()">LOGIN</button>
    </section>

    <section id="memberSection" class="hidden">
      <h2>Membership Status</h2>
     
<div id="memberStatus" class="status">Checking your membership...</div>

<section id="generatorSection" class="hidden">
  <h2>ZYXOO AI CONTENT STUDIO</h2>
  <p class="sub">Choose your content type and create something amazing.</p>

  <label for="contentType">CONTENT CATEGORY</label>
  <select id="contentType">
    <option value="AI Drama Series">AI Drama Series</option>
    <option value="UGC Classic Comedy">UGC Classic Comedy</option>
    <option value="Affiliate Marketing">Affiliate Marketing</option>
    <option value="Social Media Content">Social Media Content</option>
    <option value="Video Scripts and Storyboards">Video Scripts and Storyboards</option>
  </select>

  <label for="prompt">YOUR IDEA OR INSTRUCTIONS</label>
  <textarea id="prompt" rows="7" placeholder="Describe what you want Zyxoo to create..."></textarea>

 <button id="generateButton" class="primary" onclick="generateContent()">GENERATE CONTENT</button>

  <div id="generationMessage"></div>

  <h3>YOUR GENERATED CONTENT</h3>
  <textarea id="generatedOutput" rows="12" placeholder="Your generated content will appear here..." readonly></textarea>

  <button class="secondary" onclick="copyGeneratedContent()">COPY CONTENT</button>
</section>

<button class="secondary" onclick="signOut()">LOG OUT</button>

    </section>

    <p id="message"></p>
  </main>

  <script>
    // Replace these two values with your own Supabase details.
    const SUPABASE_URL = "https://ndecqqdlyqbrhdupvivl.supabase.co";
    const SUPABASE_KEY = "sb_publishable_eSn_SPnqkkwtu12HLqpydw_lzZmYxkA";

    const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const message = document.getElementById("message");

    function showMessage(text) {
      message.textContent = text;
    }

    async function signUp() {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      if (!email || password.length < 6) {
        showMessage("Enter a valid email and a password with at least 6 characters.");
        return;
      }

      showMessage("Creating your account...");

      const { error } = await client.auth.signUp({
        email,
        password,
        options: {
          emailRedirectTo: window.location.origin
        }
      });

      if (error) {
        showMessage(error.message);
      } else {
        showMessage("Account created! Please check your email and confirm your account before logging in.");
      }
    }

    async function signIn() {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      if (!email || !password) {
        showMessage("Enter your email and password.");
        return;
      }

      showMessage("Logging in...");

      const { error } = await client.auth.signInWithPassword({
        email,
        password
      });

      if (error) {
        showMessage(error.message);
      } else {
        await checkMembership();
      }
    }

    async function checkMembership() {
      const { data: { user } } = await client.auth.getUser();

      if (!user) return;

      document.getElementById("authSection").classList.add("hidden");
      document.getElementById("memberSection").classList.remove("hidden");

      document.getElementById("memberStatus").textContent =
        "Checking membership...";

      const { data, error } = await client
        .from("memberships")
        .select("payment_status")
        .eq("user_id", user.id)
        .maybeSingle();

      const generator = document.getElementById("generatorSection");
generator.classList.add("hidden");

if (error) {
  document.getElementById("memberStatus").textContent =
    "Unable to check membership. Please try again.";
  return;
}

if (!data) {
  document.getElementById("memberStatus").textContent =
    "Your membership record is being prepared. Please contact support if this continues.";
} else if (data.payment_status === "approved") {
  document.getElementById("memberStatus").textContent =
    "Payment approved! Your membership is active. Welcome to Zyxoo!";
  generator.classList.remove("hidden");
} else {
  document.getElementById("memberStatus").textContent =
    "Your account is registered, but your payment is still pending approval. Please wait for verification.";
}
    }

    async function generateContent() {
  const message = document.getElementById("generationMessage");
  const output = document.getElementById("generatedOutput");
  const button = document.getElementById("generateButton");

  const { data: { session } } = await client.auth.getSession();

  if (!session?.access_token) {
    message.textContent = "Please log in again.";
    return;
  }

  const category = document.getElementById("contentType").value;
  const userPrompt = document.getElementById("prompt").value.trim();

  if (!userPrompt) {
    message.textContent = "Please enter your idea or instructions.";
    return;
  }

  const fullPrompt =
    "Content category: " + category +
    "\n\nUser request:\n" + userPrompt;

  button.disabled = true;
  message.textContent = "Zyxoo is creating your content. Please wait...";
  output.value = "";

  try {
    const response = await fetch("/api/generate", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + session.access_token
      },
      body: JSON.stringify({ prompt: fullPrompt })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "Generation failed.");
    }

    output.value = data.text;
    message.textContent = "Your content is ready! 🎉";

  } catch (error) {
    message.textContent = error.message;
  } finally {
    button.disabled = false;
  }
}

async function copyGeneratedContent() {
  const output = document.getElementById("generatedOutput");
  const message = document.getElementById("generationMessage");

  if (!output.value.trim()) {
    message.textContent = "There is no content to copy yet.";
    return;
  }

  try {
    await navigator.clipboard.writeText(output.value);
    message.textContent = "Content copied successfully!";
  } catch (error) {
    message.textContent = "Unable to copy. Please select and copy the text manually.";
  }
}
    async function signOut() {
      await client.auth.signOut();
      document.getElementById("memberSection").classList.add("hidden");
      document.getElementById("authSection").classList.remove("hidden");
      showMessage("You have logged out.");
    }

    client.auth.onAuthStateChange((event, session) => {
      if (session) {
        setTimeout(() => checkMembership(), 0);
      }
    });

    client.auth.getSession().then(({ data }) => {
      if (data.session) checkMembership();
    });
  </script>
</body>
</html>
