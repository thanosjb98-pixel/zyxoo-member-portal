<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zyxoo | The ContentPilot</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #090d18;
      color: white;
      text-align: center;
    }
    main {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 30px 20px;
    }
    .logo { font-size: 42px; font-weight: bold; }
    .tagline { color: #aab4ca; margin: 12px 0 30px; }
    .card {
      max-width: 480px;
      width: 100%;
      padding: 32px 24px;
      border: 1px solid #303a50;
      border-radius: 20px;
      background: #141c2d;
    }
    .price { font-size: 48px; font-weight: bold; margin: 18px 0; }
    .access { color: #aab4ca; }
    .coming {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 20px;
      background: #7455f7;
      border-radius: 10px;
      font-weight: bold;
    }
    footer { color: #77839b; margin-top: 35px; font-size: 13px; }
  </style>
</head>
<body>
  <main>
    <div class="logo">ZYXOO</div>
    <p class="tagline">THE CONTENTPILOT</p>

    <section class="card">
      <h1>Your AI Content Creation Studio</h1>
      <p>Create stories, AI dramas, characters, storyboards and content ideas.</p>
      <div class="price">₱499</div>
      <p class="access">One-time payment · Lifetime access</p>
      <p>Payment options: GCash and Maya</p>
      <div class="coming">MEMBERSHIP OPENING SOON</div>
    </section>

    <footer>© 2026 Zyxoo The ContentPilot</footer>
  </main>
</body>
</html>
